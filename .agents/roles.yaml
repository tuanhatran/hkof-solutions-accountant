# Role-to-model bindings (DOCUMENTATION ONLY).
#
# AGY does not read this file. The effective model of each agent is the `model:` field in the
# frontmatter of `.agents/agents/<role>.md`. Keep both in sync by hand: when you change a model,
# edit the agent's frontmatter first, then update this file.
#
# Model slugs come from `agy models`.

roles:
  lead:
    file: plugins/project-agents/agents/lead/agent.md
    model: pro # Gemini 4 Argon / Claude Sonnet tier
    mainAgent: true
  builder:
    file: plugins/project-agents/agents/builder/agent.md
    model: flash # Gemini Flash tier
    mainAgent: false
  reviewer:
    file: plugins/project-agents/agents/reviewer/agent.md
    model: flash # Gemini Flash tier
    mainAgent: false
  quick-dev:
    file: plugins/project-agents/agents/quick-dev/agent.md
    model: flash # Gemini Flash tier
    mainAgent: true

