<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeOfficeExpenses — application architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>HomeOfficeExpenses — application architecture</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hkof-architecture-title hkof-architecture-desc">
        <title id="hkof-architecture-title">HomeOfficeExpenses application architecture</title>
        <desc id="hkof-architecture-desc">The React frontend calls the Spring Boot backend over the OpenAPI contract; the backend owns every calculation, stores data in PostgreSQL and on disk, and optionally delegates document extraction to a local Ollama model.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (painted first) -->
        <rect x="384" y="32" width="288" height="104" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="500" y="36" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="528" y="45" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">CLIENT</text>

        <rect x="312" y="244" width="384" height="136" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="464" y="248" width="128" height="12" rx="2" fill="#f5f5f5"/>
        <text x="528" y="257" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">TRUSTED SERVER-SIDE</text>

        <rect x="160" y="436" width="688" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="492" y="440" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="528" y="449" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">DATA &amp; MODEL</text>

        <!-- Connectors (drawn before nodes) -->
        <line x1="528" y1="88" x2="528" y2="104" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="528" y1="168" x2="528" y2="280" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <path d="M 448,344 V 444 Q 448,452 456,452 H 300 Q 292,452 292,460 V 464"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="528" y1="344" x2="528" y2="464" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 608,344 V 444 Q 608,452 616,452 H 758 Q 766,452 766,460 V 464"
              fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="288" y="428" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="304" y="437" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FILE</text>

        <rect x="540" y="380" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="560" y="389" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">JDBC</text>

        <rect x="668" y="382" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="702" y="391" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EXTRACT</text>

        <!-- Browser (input) -->
        <rect x="424" y="56" width="208" height="32" rx="6" fill="#f5f5f5"/>
        <rect x="424" y="56" width="208" height="32" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="528" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Quittances &amp; notes de frais</text>

        <!-- Frontend (backend treatment: white / ink) -->
        <rect x="440" y="104" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="440" y="104" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="448" y="110" width="20" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="458" y="119" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="528" y="138" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">React 19 + Vite</text>
        <text x="528" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">openapi-typescript client</text>

        <!-- Backend (focal) -->
        <rect x="384" y="280" width="288" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="384" y="280" width="288" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="392" y="286" width="28" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="406" y="295" fill="rgba(191,69,32,0.9)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="528" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Spring Boot backend</text>
        <text x="528" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">web · CalculationService · PDF</text>

        <!-- Storage (store) -->
        <rect x="216" y="464" width="176" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="216" y="464" width="176" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="224" y="470" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="238" y="479" fill="rgba(79,93,117,0.9)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>
        <text x="304" y="496" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Storage</text>
        <text x="304" y="514" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">uploads · PDFs</text>

        <!-- PostgreSQL (store) -->
        <rect x="464" y="464" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="464" y="464" width="128" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="472" y="470" width="20" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="482" y="479" fill="rgba(79,93,117,0.9)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
        <text x="528" y="496" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PostgreSQL 17</text>
        <text x="528" y="514" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Flyway V1–V10</text>

        <!-- Ollama (external) -->
        <rect x="688" y="464" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="688" y="464" width="160" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="696" y="470" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="710" y="479" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
        <text x="768" y="496" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Ollama</text>
        <text x="768" y="514" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">local model · :11434</text>

        <!-- Editorial callout -->
        <text x="528" y="588" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="middle">The LLM extracts; it never calculates — every amount is computed server-side.</text>

        <!-- Legend -->
        <line x1="30" y1="604" x2="930" y2="604" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="624" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="120" y="614" width="12" height="12" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="138" y="623" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">calculation authority</text>

        <rect x="320" y="614" width="12" height="12" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="338" y="623" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">store</text>

        <rect x="420" y="614" width="12" height="12" rx="3" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="438" y="623" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">model service</text>

        <line x1="560" y1="620" x2="584" y2="620" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="592" y="623" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">HTTP / API</text>

        <line x1="700" y1="620" x2="724" y2="620" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="732" y="623" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace">optional (app works without LLM)</text>
      </svg>
    </div>
  </div>
</body>
</html>
