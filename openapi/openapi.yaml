openapi: 3.1.0
info:
  title: HomeOfficeExpenses API
  description: Local API for generating rent receipts and home-office expense statements.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Generated server url
paths:
  /api/companies:
    get:
      tags:
        - company-controller
      operationId: listCompanies
      description: Liste les sociétés non supprimées.
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyDto"
    post:
      tags:
        - company-controller
      operationId: createCompany
      description: Crée une société et la lie éventuellement à un bail.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/CompanyDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/companies/{id}:
    get:
      tags:
        - company-controller
      operationId: getCompany
      description: Retourne une société non supprimée.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/CompanyDto"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      tags:
        - company-controller
      operationId: updateCompany
      description: Met à jour une société, son bail lié et détache le bail précédent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/CompanyDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
        - company-controller
      operationId: deleteCompany
      description: >-
        Supprime logiquement une société, ses salariés et ses signatures ; les baux
        liés sont conservés et détachés. Une société utilisée par des postes, notes ou
        quittances reste protégée.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/companies/{companyId}/employees:
    get:
      tags:
        - employee-controller
      operationId: listEmployees
      description: Liste les salariés non supprimés d'une société.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeDto"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    post:
      tags:
        - employee-controller
      operationId: createEmployee
      description: Crée un salarié rattaché à une société.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/EmployeeDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/employees/{id}:
    put:
      tags:
        - employee-controller
      operationId: updateEmployee
      description: Met à jour un salarié existant.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/EmployeeDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
        - employee-controller
      operationId: deleteEmployee
      description: Supprime logiquement un salarié.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/expense-items/{id}:
    put:
      tags:
        - expense-item-controller
      operationId: updateExpenseItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseItemRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ExpenseItemDto"
    delete:
      tags:
        - expense-item-controller
      operationId: deleteExpenseItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
  /api/admin/llm:
    get:
      tags:
        - admin-llm-controller
      operationId: getLlmConfig
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/LlmConfigDto"
    put:
      tags:
        - admin-llm-controller
      operationId: updateLlmConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmConfigRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/LlmConfigDto"
  /api/templates:
    get:
      tags:
        - template-controller
      operationId: listTemplates
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - RENT_RECEIPT
              - EXPENSE_STATEMENT
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateDto"
    post:
      tags:
        - template-controller
      operationId: uploadTemplate
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - RENT_RECEIPT
              - EXPENSE_STATEMENT
        - name: name
          in: query
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/TemplateDto"
  /api/templates/{id}/preview:
    post:
      tags:
        - template-controller
      operationId: previewTemplate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
  /api/templates/{id}/activate:
    post:
      tags:
        - template-controller
      operationId: activateTemplate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/TemplateDto"
  /api/templates/default/{type}:
    get:
      tags:
        - template-controller
      operationId: getDefaultTemplate
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - RENT_RECEIPT
              - EXPENSE_STATEMENT
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
    post:
      tags:
        - template-controller
      operationId: resetDefaultTemplate
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - RENT_RECEIPT
              - EXPENSE_STATEMENT
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/TemplateDto"
  /api/rent-receipts:
    get:
      tags:
        - rent-receipt-controller
      operationId: listRentReceipts
      description: Liste les quittances, éventuellement filtrées par société.
      parameters:
        - name: companyId
          in: query
          required: false
          description: Identifiant de la société de la quittance.
          schema:
            type: integer
            format: int64
        - name: month
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RentReceiptDto"
    post:
      tags:
        - rent-receipt-controller
      operationId: createRentReceipt
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentReceiptRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/RentReceiptDto"
  /api/rent-receipts/preview:
    post:
      tags:
        - rent-receipt-controller
      operationId: previewRentReceipt
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentReceiptRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
  /api/receipts:
    post:
      tags:
        - receipt-controller
      operationId: uploadReceipt
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ReceiptDto"
  /api/receipts/{id}/analysis:
    post:
      tags:
        - receipt-controller
      operationId: startReceiptAnalysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "202":
          description: Accepted
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/AnalysisStartResponse"
  /api/expense-statements:
    get:
      tags:
        - expense-statement-controller
      operationId: listExpenseStatements
      description: Liste les notes de frais d'une société.
      parameters:
        - name: companyId
          in: query
          required: true
          description: Identifiant de la société propriétaire des notes de frais.
          schema:
            type: integer
            format: int64
        - name: month
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatementDto"
    post:
      tags:
        - expense-statement-controller
      operationId: createExpenseStatement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementGenerationRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/StatementDto"
  /api/expense-statements/preview:
    post:
      tags:
        - expense-statement-controller
      operationId: previewStatement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementPreviewRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
  /api/expense-statements/draft:
    post:
      tags:
        - expense-statement-controller
      operationId: createStatementDraft
      description: Construit le brouillon d'une note de frais pour une société et un mois.
      parameters:
        - name: companyId
          in: query
          required: true
          description: Identifiant de la société.
          schema:
            type: integer
            format: int64
        - name: month
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/DraftDto"
  /api/expense-statements/calculation:
    post:
      tags:
        - expense-statement-controller
      operationId: calculateStatement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementCalculationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/CalculationResponse"
  /api/expense-items:
    get:
      tags:
        - expense-item-controller
      operationId: listExpenseItems
      description: Liste les postes de frais de la société active.
      parameters:
        - name: companyId
          in: query
          required: true
          description: Identifiant de la société propriétaire des postes de frais.
          schema:
            type: integer
            format: int64
        - name: all
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseItemDto"
    post:
      tags:
        - expense-item-controller
      operationId: createExpenseItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseItemRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ExpenseItemDto"
  /api/e2e/reset:
    post:
      tags:
        - e-2e-controller
      operationId: resetE2eData
      responses:
        "204":
          description: No Content
  /api/admin/llm/test:
    post:
      tags:
        - admin-llm-controller
      operationId: testLlm
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/LlmTestResponse"
  /api/templates/{id}/file:
    get:
      tags:
        - template-controller
      operationId: getTemplateFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
  /api/templates/variables:
    get:
      tags:
        - template-controller
      operationId: getTemplateVariables
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - RENT_RECEIPT
              - EXPENSE_STATEMENT
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateVariableDto"
  /api/rent-receipts/{id}:
    get:
      tags:
        - rent-receipt-controller
      operationId: getRentReceipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/RentReceiptDto"
  /api/rent-receipts/{id}/pdf:
    get:
      tags:
        - rent-receipt-controller
      operationId: getRentReceiptPdf
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
  /api/rent-receipts/active:
    get:
      tags:
        - rent-receipt-controller
      operationId: getActiveRentReceipt
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
        - name: companyId
          in: query
          required: false
          description: Société utilisée pour l'identité et les données de domicile.
          schema:
            type: integer
            format: int64
        - name: landlordId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: tenantId
          in: query
          required: false
          description: Personne physique locataire ; exclusif avec tenantCompanyId.
          schema:
            type: integer
            format: int64
        - name: tenantCompanyId
          in: query
          required: false
          description: Société locataire ; exclusif avec tenantId.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/RentReceiptDto"
  /api/receipts/{id}:
    get:
      tags:
        - receipt-controller
      operationId: getReceipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ReceiptDto"
    delete:
      tags:
        - receipt-controller
      operationId: deleteReceipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
  /api/receipts/{id}/file:
    get:
      tags:
        - receipt-controller
      operationId: getReceiptFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
  /api/expense-statements/{id}:
    get:
      tags:
        - expense-statement-controller
      operationId: getExpenseStatement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/StatementDto"
  /api/expense-statements/{id}/pdf:
    get:
      tags:
        - expense-statement-controller
      operationId: getExpenseStatementPdf
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: complete
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
  /api/expense-statements/{id}/zip:
    get:
      tags:
        - expense-statement-controller
      operationId: getExpenseStatementZip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/zip:
              schema:
                type: string
                format: binary
  /api/expense-statements/active:
    get:
      tags:
        - expense-statement-controller
      operationId: getActiveExpenseStatement
      description: Retourne la note de frais active d'une société pour un mois.
      parameters:
        - name: companyId
          in: query
          required: true
          description: Identifiant de la société.
          schema:
            type: integer
            format: int64
        - name: month
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/StatementDto"
  /api/analyses/{id}:
    get:
      tags:
        - analysis-controller
      operationId: getAnalysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/AnalysisDto"
    delete:
      tags:
        - analysis-controller
      operationId: cancelAnalysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/AnalysisDto"
  /api/admin/llm/status:
    get:
      tags:
        - admin-llm-controller
      operationId: getLlmStatus
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/LlmStatusDto"
  /api/admin/llm/models:
    get:
      tags:
        - admin-llm-controller
      operationId: listLlmModels
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlmModelDto"
  /api/admin/llm/default-prompt:
    get:
      tags:
        - admin-llm-controller
      operationId: getDefaultLlmPrompt
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/DefaultPromptDto"
  /api/templates/{id}:
    delete:
      tags:
        - template-controller
      operationId: deleteTemplate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
  /api/signatures:
    get:
      tags:
        - signature-controller
      operationId: listSignatures
      description: Liste les signatures non supprimées de la personne demandée.
      parameters:
        - name: personId
          in: query
          required: true
          description: Identifiant de la personne (personne physique ou salarié), obligatoire.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignatureDto"
    post:
      tags:
        - signature-controller
      operationId: createSignature
      description: >-
        Dépose une signature pour une personne. Plusieurs signatures peuvent
        coexister pour une même personne.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                personId:
                  type: integer
                  format: int64
                  description: Personne propriétaire de la signature.
                name:
                  type: string
                file:
                  type: string
                  format: binary
              required:
                - personId
                - name
                - file
        required: true
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/SignatureDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
