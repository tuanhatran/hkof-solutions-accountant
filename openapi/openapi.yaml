openapi: 3.1.0
info:
  title: HomeOfficeExpenses API
  description: API locale de génération de quittances et de notes de frais d'occupation.
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/settings:
    get:
      tags:
      - settings-controller
      operationId: getSettings
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SettingsDto"
    put:
      tags:
      - settings-controller
      operationId: updateSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SettingsDto"
  /api/expense-items/{id}:
    put:
      tags:
      - expense-item-controller
      operationId: updateExpenseItem
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseItemRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExpenseItemDto"
    delete:
      tags:
      - expense-item-controller
      operationId: deleteExpenseItem
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /api/admin/llm:
    get:
      tags:
      - admin-llm-controller
      operationId: getLlmConfig
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LlmConfigDto"
    put:
      tags:
      - admin-llm-controller
      operationId: updateLlmConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmConfigRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LlmConfigDto"
  /api/templates:
    get:
      tags:
      - template-controller
      operationId: listTemplates
      parameters:
      - name: type
        in: query
        required: true
        schema:
          type: string
          enum:
          - RENT_RECEIPT
          - EXPENSE_STATEMENT
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateDto"
    post:
      tags:
      - template-controller
      operationId: uploadTemplate
      parameters:
      - name: type
        in: query
        required: true
        schema:
          type: string
          enum:
          - RENT_RECEIPT
          - EXPENSE_STATEMENT
      - name: name
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateDto"
  /api/templates/{id}/preview:
    post:
      tags:
      - template-controller
      operationId: previewTemplate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /api/templates/{id}/activate:
    post:
      tags:
      - template-controller
      operationId: activateTemplate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateDto"
  /api/templates/default/{type}:
    get:
      tags:
      - template-controller
      operationId: getDefaultTemplate
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum:
          - RENT_RECEIPT
          - EXPENSE_STATEMENT
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
    post:
      tags:
      - template-controller
      operationId: resetDefaultTemplate
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum:
          - RENT_RECEIPT
          - EXPENSE_STATEMENT
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TemplateDto"
  /api/rent-receipts:
    get:
      tags:
      - rent-receipt-controller
      operationId: listRentReceipts
      parameters:
      - name: month
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RentReceiptDto"
    post:
      tags:
      - rent-receipt-controller
      operationId: createRentReceipt
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentReceiptRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RentReceiptDto"
  /api/rent-receipts/preview:
    post:
      tags:
      - rent-receipt-controller
      operationId: previewRentReceipt
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentReceiptRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /api/receipts:
    post:
      tags:
      - receipt-controller
      operationId: uploadReceipt
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReceiptDto"
  /api/receipts/{id}/analysis:
    post:
      tags:
      - receipt-controller
      operationId: startReceiptAnalysis
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AnalysisStartResponse"
  /api/expense-statements:
    get:
      tags:
      - expense-statement-controller
      operationId: listExpenseStatements
      parameters:
      - name: month
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatementDto"
    post:
      tags:
      - expense-statement-controller
      operationId: createExpenseStatement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementGenerationRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StatementDto"
  /api/expense-statements/preview:
    post:
      tags:
      - expense-statement-controller
      operationId: previewStatement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementPreviewRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /api/expense-statements/draft:
    post:
      tags:
      - expense-statement-controller
      operationId: createStatementDraft
      parameters:
      - name: month
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DraftDto"
  /api/expense-statements/calculation:
    post:
      tags:
      - expense-statement-controller
      operationId: calculateStatement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementCalculationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CalculationResponse"
  /api/expense-items:
    get:
      tags:
      - expense-item-controller
      operationId: listExpenseItems
      parameters:
      - name: all
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseItemDto"
    post:
      tags:
      - expense-item-controller
      operationId: createExpenseItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseItemRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExpenseItemDto"
  /api/e2e/reset:
    post:
      tags:
      - e-2e-controller
      operationId: resetE2eData
      responses:
        "204":
          description: No Content
  /api/admin/llm/test:
    post:
      tags:
      - admin-llm-controller
      operationId: testLlm
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LlmTestResponse"
  /api/templates/{id}/file:
    get:
      tags:
      - template-controller
      operationId: getTemplateFile
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /api/templates/variables:
    get:
      tags:
      - template-controller
      operationId: getTemplateVariables
      parameters:
      - name: type
        in: query
        required: true
        schema:
          type: string
          enum:
          - RENT_RECEIPT
          - EXPENSE_STATEMENT
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateVariableDto"
  /api/rent-receipts/{id}:
    get:
      tags:
      - rent-receipt-controller
      operationId: getRentReceipt
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RentReceiptDto"
  /api/rent-receipts/{id}/pdf:
    get:
      tags:
      - rent-receipt-controller
      operationId: getRentReceiptPdf
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /api/rent-receipts/active:
    get:
      tags:
      - rent-receipt-controller
      operationId: getActiveRentReceipt
      parameters:
      - name: month
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RentReceiptDto"
  /api/receipts/{id}:
    get:
      tags:
      - receipt-controller
      operationId: getReceipt
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReceiptDto"
    delete:
      tags:
      - receipt-controller
      operationId: deleteReceipt
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
  /api/receipts/{id}/file:
    get:
      tags:
      - receipt-controller
      operationId: getReceiptFile
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /api/expense-statements/{id}:
    get:
      tags:
      - expense-statement-controller
      operationId: getExpenseStatement
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StatementDto"
  /api/expense-statements/{id}/pdf:
    get:
      tags:
      - expense-statement-controller
      operationId: getExpenseStatementPdf
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: complete
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: byte
  /api/expense-statements/active:
    get:
      tags:
      - expense-statement-controller
      operationId: getActiveExpenseStatement
      parameters:
      - name: month
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StatementDto"
  /api/analyses/{id}:
    get:
      tags:
      - analysis-controller
      operationId: getAnalysis
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AnalysisDto"
    delete:
      tags:
      - analysis-controller
      operationId: cancelAnalysis
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AnalysisDto"
  /api/analyses/{id}/events:
    get:
      tags:
      - analysis-controller
      operationId: streamAnalysisEvents
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEmitter"
  /api/admin/llm/status:
    get:
      tags:
      - admin-llm-controller
      operationId: getLlmStatus
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LlmStatusDto"
  /api/admin/llm/models:
    get:
      tags:
      - admin-llm-controller
      operationId: listLlmModels
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlmModelDto"
  /api/admin/llm/default-prompt:
    get:
      tags:
      - admin-llm-controller
      operationId: getDefaultLlmPrompt
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DefaultPromptDto"
  /api/templates/{id}:
    delete:
      tags:
      - template-controller
      operationId: deleteTemplate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
components:
  schemas:
    SettingsRequest:
      type: object
      properties:
        companyName:
          type: string
        legalForm:
          type: string
        siren:
          type: string
        companyAddress:
          type: string
        managerName:
          type: string
        homeAddress:
          type: string
        totalArea:
          type: string
        businessArea:
          type: string
        landlordName:
          type: string
        landlordAddress:
          type: string
        tenantName:
          type: string
        tenantAddress:
          type: string
        rentExclCharges:
          type: string
        chargesAdvance:
          type: string
        issuePlace:
          type: string
    SettingsDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        companyName:
          type: string
        legalForm:
          type: string
        siren:
          type: string
        companyAddress:
          type: string
        managerName:
          type: string
        homeAddress:
          type: string
        totalArea:
          type: string
        businessArea:
          type: string
        proRataBase:
          type: string
        proRataBaseDetail:
          type: string
        landlordName:
          type: string
        landlordAddress:
          type: string
        tenantName:
          type: string
        tenantAddress:
          type: string
        rentExclCharges:
          type: string
        chargesAdvance:
          type: string
        issuePlace:
          type: string
    ExpenseItemRequest:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
        supplier:
          type: string
        proRataPct:
          type: string
        periodicity:
          type: string
        active:
          type: boolean
        sortOrder:
          type: integer
          format: int32
        multipleLinesAllowed:
          type: boolean
    ExpenseItemDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        label:
          type: string
        supplier:
          type: string
        proRataPct:
          type: string
        periodicity:
          type: string
        active:
          type: boolean
        sortOrder:
          type: integer
          format: int32
        multipleLinesAllowed:
          type: boolean
    LlmConfigRequest:
      type: object
      properties:
        active:
          type: boolean
        supplier:
          type: string
        url:
          type: string
        model:
          type: string
        timeoutSeconds:
          type: integer
          format: int32
        temperature:
          type: string
        numCtx:
          type: integer
          format: int32
        maxPages:
          type: integer
          format: int32
        ocrActive:
          type: boolean
        extractionPrompt:
          type: string
        apiKey:
          type: string
    LlmConfigDto:
      type: object
      properties:
        active:
          type: boolean
        supplier:
          type: string
        url:
          type: string
        model:
          type: string
        timeoutSeconds:
          type: integer
          format: int32
        temperature:
          type: string
        numCtx:
          type: integer
          format: int32
        maxPages:
          type: integer
          format: int32
        ocrActive:
          type: boolean
        extractionPrompt:
          type: string
        apiKeyConfigured:
          type: boolean
        remoteUrl:
          type: boolean
        warning:
          type: string
    TemplateDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        name:
          type: string
        version:
          type: integer
          format: int32
        format:
          type: string
        active:
          type: boolean
        builtIn:
          type: boolean
        createdAt:
          type: string
          format: date-time
        report:
          $ref: "#/components/schemas/ValidationReportDto"
    ValidationReportDto:
      type: object
      properties:
        recognizedVariables:
          type: array
          items:
            type: string
        unknownVariables:
          type: array
          items:
            type: string
        missingVariables:
          type: array
          items:
            type: string
        structureValid:
          type: boolean
        errors:
          type: array
          items:
            type: string
    RentReceiptRequest:
      type: object
      properties:
        month:
          type: string
        periodStart:
          type: string
        periodEnd:
          type: string
        rentExclCharges:
          type: string
        charges:
          type: string
        paymentDate:
          type: string
        issueDate:
          type: string
        templateId:
          type: integer
          format: int64
    RentReceiptDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        month:
          type: string
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        rentExclCharges:
          type: string
        charges:
          type: string
        total:
          type: string
        paymentDate:
          type: string
          format: date
        issueDate:
          type: string
          format: date
        version:
          type: integer
          format: int32
        status:
          type: string
        templateId:
          type: integer
          format: int64
        templateName:
          type: string
        templateVersion:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        pdfAvailable:
          type: boolean
    ReceiptDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fileName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    AnalysisStartResponse:
      type: object
      properties:
        analysisId:
          type: integer
          format: int64
        status:
          type: string
    ExpenseLineRequest:
      type: object
      properties:
        itemCode:
          type: string
        amountInclVat:
          type: string
        proRataPct:
          type: string
        periodStart:
          type: string
        periodEnd:
          type: string
        monthlyAmountOverride:
          type: string
        receiptId:
          type: integer
          format: int64
        amountSource:
          type: string
        aiDetectedAmount:
          type: string
        aiConfidence:
          type: string
    StatementGenerationRequest:
      type: object
      properties:
        month:
          type: string
        templateId:
          type: integer
          format: int64
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseLineRequest"
    ExpenseLineDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        itemCode:
          type: string
        itemLabel:
          type: string
        supplier:
          type: string
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        amountInclVat:
          type: string
        monthlyAmount:
          type: string
        proRataPct:
          type: string
        claimedAmount:
          type: string
        receiptId:
          type: integer
          format: int64
        receiptName:
          type: string
        amountSource:
          type: string
        aiDetectedAmount:
          type: string
        aiConfidence:
          type: string
    StatementDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        month:
          type: string
        number:
