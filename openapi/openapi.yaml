components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: >-
        Session ouverte par POST /api/auth/login. Les mutations authentifiées
        exigent aussi le cookie XSRF-TOKEN recopié dans l'en-tête X-XSRF-TOKEN.
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Adresse e-mail normalisée en minuscules.
        password:
          type: string
          format: password
          maxLength: 100
    ConfirmEmailRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Jeton reçu par e-mail, valable 24 heures et à usage unique.
    ResendConfirmationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          maxLength: 100
    CurrentUserDto:
      type: object
      properties:
        email:
          type: string
          format: email
        mustChangePassword:
          type: boolean
          description: Vrai tant que le changement de mot de passe imposé n'est pas fait.
    SignatureDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        personId:
          type: integer
          format: int64
          description: Personne propriétaire de la signature.
        personName:
          type:
            - string
            - "null"
          description: Nom lisible de la personne, personne physique ou salarié.
        name:
          type: string
        mimeType:
          type: string
        createdAt:
          type: string
          format: date-time
    CompanyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Raison sociale de la société.
        legalForm:
          type: string
          description: Forme juridique (SAS, SARL, ...).
        siren:
          type: string
          description: Numéro SIREN, unique parmi les sociétés non supprimées.
        address:
          type: string
          description: Adresse du siège social.
        managerName:
          type: string
          description: Nom du représentant légal.
        leaseId:
          type:
            - integer
            - "null"
          format: int64
          description: >-
            Bail lié à la société ; facultatif. Une société peut posséder
            plusieurs baux société ; ce champ désigne son bail actif, qui peut être
            re-pointé vers un autre bail de la même société. Sans valeur enregistrée,
            le bail actif est son premier bail (plus petit id). Un bail appartient à au plus une société.
        proRataBase:
          type: string
          description: Base de prorata calculée, en pourcentage décimal.
        proRataBaseDetail:
          type: string
          description: Détail lisible du calcul de la base de prorata.
        issuePlace:
          type: string
          description: Lieu d'émission des documents.
    CompanyDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        legalForm:
          type: string
        siren:
          type: string
        address:
          type: string
        managerName:
          type: string
        leaseId:
          type:
            - integer
            - "null"
          format: int64
        proRataBase:
          type: string
        proRataBaseDetail:
          type: string
        issuePlace:
          type: string
    AdditionalCharge:
      type: object
      required:
        - label
        - amount
      properties:
        label:
          type: string
          maxLength: 120
          description: Libellé libre de la charge supplémentaire d'une quittance.
        amount:
          type: string
          pattern: "^[0-9]+(\\.[0-9]{1,2})?$"
          description: >-
            Montant en euros, strictement positif, fourni sous forme de chaîne
            décimale. Il entre dans le total calculé par le backend.
    EmployeeRequest:
      type: object
      required:
        - companyId
        - firstName
        - lastName
        - title
      properties:
        companyId:
          type: integer
          format: int64
          description: Société à laquelle le salarié appartient.
        firstName:
          type: string
        lastName:
          type: string
        email:
          type:
            - string
            - "null"
          description: Adresse électronique, unique par société lorsqu'elle est renseignée.
        address:
          type:
            - string
            - "null"
          description: Adresse personnelle facultative du salarié.
        title:
          type: string
          enum:
            - CEO
            - CFO
            - ACCOUNTANT
            - EMPLOYEE
          description: >-
            Intitulé descriptif du salarié ; il ne donne aucun droit tant que
            le contrôle d'accès n'est pas implémenté.
        issuePlace:
          type:
            - string
            - "null"
          description: >-
            Lieu d'émission facultatif du salarié. Le premier lieu non vide
            d'un salarié CEO est imprimé sur la note de frais de la société,
            sinon le lieu d'émission de la société s'applique.
    EmployeeDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        companyId:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type:
            - string
            - "null"
        address:
          type:
            - string
            - "null"
        signatureCount:
          type: integer
          format: int32
          readOnly: true
          description: Nombre de signatures non supprimées du salarié.
        title:
          type: string
          enum:
            - CEO
            - CFO
            - ACCOUNTANT
            - EMPLOYEE
        issuePlace:
          type:
            - string
            - "null"
          description: Lieu d'émission facultatif du salarié.
    PersonRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Nom de la personne physique.
        address:
          type:
            - string
            - "null"
          description: Adresse personnelle facultative.
        issuePlace:
          type:
            - string
            - "null"
          description: >-
            Lieu d'émission facultatif imprimé après « Fait à » sur les
            quittances de ce bailleur. Vide ou nul : le lieu de la société du
            bail, puis une chaîne vide.
    PersonDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type:
            - string
            - "null"
        issuePlace:
          type:
            - string
            - "null"
          description: Lieu d'émission facultatif du bailleur.
        signatureCount:
          type: integer
          format: int32
          readOnly: true
          description: Nombre de signatures non supprimées de la personne.
    AddressDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
    LeaseRequest:
      type: object
      properties:
        companyLease:
          type: boolean
          description: >-
            Bail société : le locataire est une société (companyId obligatoire) et
            le bailleur une personne physique. Sinon le bailleur et le locataire
            sont deux personnes physiques distinctes.
