        bailleurNom:
          type: string
        bailleurAdresse:
          type: string
        locataireNom:
          type: string
        locataireAdresse:
          type: string
        loyerHc:
          type: string
        provisionCharges:
          type: string
        lieuEmission:
          type: string
    LlmConfigRequest:
