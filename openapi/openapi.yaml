        fournisseur:
          type: string
        url:
          type: string
        modele:
          type: string
        timeoutSeconds:
          type: integer
          format: int32
        temperature:
          type: string
        numCtx:
          type: integer
          format: int32
        pagesMax:
          type: integer
          format: int32
        ocrActif:
          type: boolean
        promptExtraction:
          type: string
        cleApi:
