openapi: 3.1.0
info:
  title: HomeOfficeExpenses API
  description: Local API for generating rent receipts and home-office expense statements.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Generated server url
security:
  - cookieAuth: []
paths:
  /api/auth/register:
    post:
      tags:
        - auth-controller
      operationId: register
      description: >-
        Crée un compte non confirmé et envoie un e-mail de confirmation. Le mot de
        passe ne doit pas être vide et ne peut pas dépasser 100 caractères.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/auth/confirm-email:
    post:
      tags:
        - auth-controller
      operationId: confirmEmail
      description: Confirme l'adresse e-mail à partir du jeton reçu par e-mail.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmEmailRequest"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/auth/resend-confirmation:
    post:
      tags:
        - auth-controller
      operationId: resendConfirmation
      description: >-
        Renvoie l'e-mail de confirmation si un compte non confirmé existe. La
        réponse ne révèle jamais l'existence du compte.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendConfirmationRequest"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/auth/login:
    post:
      tags:
        - auth-controller
      operationId: login
      description: >-
        Ouvre une session (cookie JSESSIONID) pour un compte confirmé. Le jeton CSRF
        XSRF-TOKEN est déposé en cookie pour les requêtes authentifiées.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/CurrentUserDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Identifiants incorrects
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Adresse e-mail non confirmée
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/auth/logout:
    post:
      tags:
        - auth-controller
      operationId: logout
      description: Ferme la session courante.
      responses:
        "204":
          description: No Content
        "401":
          description: Non authentifié
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/auth/change-password:
    post:
      tags:
        - auth-controller
      operationId: changePassword
      description: >-
        Change le mot de passe du compte connecté. Obligatoire au premier accès
        quand un changement de mot de passe est imposé.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/CurrentUserDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Non authentifié
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/auth/me:
    get:
      tags:
        - auth-controller
      operationId: currentUser
      description: Retourne le compte connecté et l'état du changement de mot de passe imposé.
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/CurrentUserDto"
        "401":
          description: Non authentifié
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/companies:
    get:
      tags:
        - company-controller
      operationId: listCompanies
      description: Liste les sociétés non supprimées.
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyDto"
    post:
      tags:
        - company-controller
      operationId: createCompany
      description: Crée une société et la lie éventuellement à un bail.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/CompanyDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/companies/{id}:
    get:
      tags:
        - company-controller
      operationId: getCompany
      description: Retourne une société non supprimée.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/CompanyDto"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    put:
      tags:
        - company-controller
      operationId: updateCompany
      description: Met à jour une société, son bail lié et détache le bail précédent.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/CompanyDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
        - company-controller
      operationId: deleteCompany
      description: >-
        Supprime logiquement une société, ses salariés et ses signatures ; les baux
        liés sont conservés et détachés. Une société utilisée par des postes, notes ou
        quittances reste protégée.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/companies/{companyId}/employees:
    get:
      tags:
        - employee-controller
      operationId: listEmployees
      description: Liste les salariés non supprimés d'une société.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeDto"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    post:
      tags:
        - employee-controller
      operationId: createEmployee
      description: Crée un salarié rattaché à une société.
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/EmployeeDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/employees/{id}:
    put:
      tags:
        - employee-controller
      operationId: updateEmployee
      description: Met à jour un salarié existant.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/EmployeeDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
        - employee-controller
      operationId: deleteEmployee
      description: Supprime logiquement un salarié.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/expense-items/{id}:
    put:
      tags:
        - expense-item-controller
      operationId: updateExpenseItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseItemRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ExpenseItemDto"
    delete:
      tags:
        - expense-item-controller
      operationId: deleteExpenseItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
  /api/admin/llm:
    get:
      tags:
        - admin-llm-controller
      operationId: getLlmConfig
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/LlmConfigDto"
    put:
      tags:
        - admin-llm-controller
      operationId: updateLlmConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmConfigRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/LlmConfigDto"
  /api/templates:
    get:
      tags:
        - template-controller
      operationId: listTemplates
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - RENT_RECEIPT
              - EXPENSE_STATEMENT
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateDto"
    post:
      tags:
        - template-controller
      operationId: uploadTemplate
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - RENT_RECEIPT
              - EXPENSE_STATEMENT
        - name: name
          in: query
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/TemplateDto"
  /api/templates/{id}/preview:
    post:
      tags:
        - template-controller
      operationId: previewTemplate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
  /api/templates/{id}/activate:
    post:
      tags:
        - template-controller
      operationId: activateTemplate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/TemplateDto"
  /api/templates/default/{type}:
    get:
      tags:
        - template-controller
      operationId: getDefaultTemplate
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - RENT_RECEIPT
              - EXPENSE_STATEMENT
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
    post:
      tags:
        - template-controller
      operationId: resetDefaultTemplate
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - RENT_RECEIPT
              - EXPENSE_STATEMENT
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/TemplateDto"
  /api/rent-receipts:
    get:
      tags:
        - rent-receipt-controller
      operationId: listRentReceipts
      description: Liste les quittances, éventuellement filtrées par société.
      parameters:
        - name: companyId
          in: query
          required: false
          description: Identifiant de la société de la quittance.
          schema:
            type: integer
            format: int64
        - name: month
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RentReceiptDto"
    post:
      tags:
        - rent-receipt-controller
      operationId: createRentReceipt
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentReceiptRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/RentReceiptDto"
  /api/rent-receipts/preview:
    post:
      tags:
        - rent-receipt-controller
      operationId: previewRentReceipt
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentReceiptRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
  /api/receipts:
    post:
      tags:
        - receipt-controller
      operationId: uploadReceipt
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ReceiptDto"
  /api/receipts/{id}/analysis:
    post:
      tags:
        - receipt-controller
      operationId: startReceiptAnalysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "202":
          description: Accepted
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/AnalysisStartResponse"
  /api/expense-statements:
    get:
      tags:
        - expense-statement-controller
      operationId: listExpenseStatements
      description: Liste les notes de frais d'une société.
      parameters:
        - name: companyId
          in: query
          required: true
          description: Identifiant de la société propriétaire des notes de frais.
          schema:
            type: integer
            format: int64
        - name: leaseId
          in: query
          required: false
          description: >-
            Filtrer sur un bail société : retourne les notes de ce bail ainsi que
            les notes héritées sans bail (lease_id NULL). Sans ce paramètre, toutes
            les notes de la société.
          schema:
            type: integer
            format: int64
        - name: month
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatementDto"
    post:
      tags:
        - expense-statement-controller
      operationId: createExpenseStatement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementGenerationRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/StatementDto"
  /api/expense-statements/preview:
    post:
      tags:
        - expense-statement-controller
      operationId: previewStatement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementPreviewRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
  /api/expense-statements/draft:
    post:
      tags:
        - expense-statement-controller
      operationId: createStatementDraft
      description: Construit le brouillon d'une note de frais pour une société et un mois.
      parameters:
        - name: companyId
          in: query
          required: true
          description: Identifiant de la société.
          schema:
            type: integer
            format: int64
        - name: month
          in: query
          required: true
          schema:
            type: string
        - name: leaseId
          in: query
          required: false
          description: >-
            Bail société actif retenu pour le prorata et les postes manquants ;
            les postes hérités sans bail restent inclus. Sans ce paramètre, comportement historique.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/DraftDto"
  /api/expense-statements/calculation:
    post:
      tags:
        - expense-statement-controller
      operationId: calculateStatement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementCalculationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/CalculationResponse"
  /api/drafts/rent-receipts:
    get:
      tags:
        - document-draft-controller
      operationId: getRentReceiptDraft
      description: >-
        Brouillon de quittance enregistré pour un bailleur, un locataire et un mois.
        Répond 204 quand aucun brouillon actif n'existe pour cette portée.
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
        - name: landlordId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: tenantId
          in: query
          required: false
          description: Locataire personne physique ; exclusif avec tenantCompanyId.
          schema:
            type: integer
            format: int64
        - name: tenantCompanyId
          in: query
          required: false
          description: Locataire société ; exclusif avec tenantId.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Brouillon actif
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/RentReceiptDraftDto"
        "204":
          description: Aucun brouillon actif pour cette portée
    put:
      tags:
        - document-draft-controller
      operationId: saveRentReceiptDraft
      description: >-
        Enregistre l'état éditable d'une quittance. Chaque enregistrement insère un
        nouveau brouillon et supprime logiquement le brouillon actif de la même portée.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentReceiptDraftRequest"
        required: true
      responses:
        "200":
          description: Brouillon enregistré
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/RentReceiptDraftDto"
  /api/drafts/expense-statements:
    get:
      tags:
        - document-draft-controller
      operationId: getStatementDraft
      description: >-
        Brouillon de note de frais enregistré pour une société, un mois et, si fourni, un bail.
        Répond 204 quand aucun brouillon actif n'existe pour cette portée.
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: month
          in: query
          required: true
          schema:
            type: string
        - name: leaseId
          in: query
          required: false
          description: Identifiant du bail. Absent, la portée historique de la société est utilisée.
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Brouillon actif
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/StatementDraftDto"
        "204":
          description: Aucun brouillon actif pour cette portée
    put:
      tags:
        - document-draft-controller
      operationId: saveStatementDraft
      description: >-
        Enregistre l'état éditable d'une note de frais. Chaque enregistrement insère un
        nouveau brouillon et supprime logiquement le brouillon actif de la même portée.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementDraftRequest"
        required: true
      responses:
        "200":
          description: Brouillon enregistré
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/StatementDraftDto"
  /api/drafts/{id}:
    delete:
      tags:
        - document-draft-controller
      operationId: deleteDraft
      description: Supprime logiquement un brouillon, par exemple après génération du document.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Brouillon supprimé
        "404":
          description: Brouillon introuvable
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/expense-items:
    get:
      tags:
        - expense-item-controller
      operationId: listExpenseItems
      description: Liste les postes de frais de la société active.
      parameters:
        - name: companyId
          in: query
          required: true
          description: Identifiant de la société propriétaire des postes de frais.
          schema:
            type: integer
            format: int64
        - name: leaseId
          in: query
          required: false
          description: >-
            Filtrer sur un bail société : retourne les postes de ce bail ainsi que
            les postes hérités sans bail (lease_id NULL). Sans ce paramètre, tous les
            postes de la société. Doit être un bail actif de la société, sinon 400.
