components:
  schemas:
    SignatureDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        personId:
          type: integer
          format: int64
          description: Personne propriétaire de la signature.
        personName:
          type:
            - string
            - "null"
          description: Nom lisible de la personne, personne physique ou salarié.
        name:
          type: string
        mimeType:
          type: string
        createdAt:
          type: string
          format: date-time
    CompanyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Raison sociale de la société.
        legalForm:
          type: string
          description: Forme juridique (SAS, SARL, ...).
        siren:
          type: string
          description: Numéro SIREN, unique parmi les sociétés non supprimées.
        address:
          type: string
          description: Adresse du siège social.
        managerName:
          type: string
          description: Nom du représentant légal.
        leaseId:
          type:
            - integer
            - "null"
          format: int64
          description: >-
            Bail lié à la société ; facultatif. Un bail appartient à au plus une
            société et la société porte au plus un bail.
        proRataBase:
          type: string
          description: Base de prorata calculée, en pourcentage décimal.
        proRataBaseDetail:
          type: string
          description: Détail lisible du calcul de la base de prorata.
        issuePlace:
          type: string
          description: Lieu d'émission des documents.
    CompanyDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        legalForm:
          type: string
        siren:
          type: string
        address:
          type: string
        managerName:
          type: string
        leaseId:
          type:
            - integer
            - "null"
          format: int64
        proRataBase:
          type: string
        proRataBaseDetail:
          type: string
        issuePlace:
          type: string
    EmployeeRequest:
      type: object
      required:
        - companyId
        - firstName
        - lastName
        - title
      properties:
        companyId:
          type: integer
          format: int64
          description: Société à laquelle le salarié appartient.
        firstName:
          type: string
        lastName:
          type: string
        email:
          type:
            - string
            - "null"
          description: Adresse électronique, unique par société lorsqu'elle est renseignée.
        address:
          type:
            - string
            - "null"
          description: Adresse personnelle facultative du salarié.
        title:
          type: string
          enum:
            - CEO
            - CFO
            - ACCOUNTANT
            - EMPLOYEE
          description: >-
            Intitulé descriptif du salarié ; il ne donne aucun droit tant que
            le contrôle d'accès n'est pas implémenté.
    EmployeeDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        companyId:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type:
            - string
            - "null"
        address:
          type:
            - string
            - "null"
        signatureCount:
          type: integer
          format: int32
          readOnly: true
          description: Nombre de signatures non supprimées du salarié.
        title:
          type: string
          enum:
            - CEO
            - CFO
            - ACCOUNTANT
            - EMPLOYEE
    PersonRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Nom de la personne physique.
        address:
          type:
            - string
            - "null"
          description: Adresse personnelle facultative.
    PersonDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type:
            - string
            - "null"
        signatureCount:
          type: integer
          format: int32
          readOnly: true
          description: Nombre de signatures non supprimées de la personne.
    AddressDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
    LeaseRequest:
      type: object
      properties:
        companyLease:
          type: boolean
          description: >-
            Bail société : le locataire est une société (companyId obligatoire) et
            le bailleur une personne physique. Sinon le bailleur et le locataire
            sont deux personnes physiques distinctes.
        landlordId:
          type: integer
          format: int64
          description: Personne physique bailleur.
        companyId:
          type:
            - integer
            - "null"
          format: int64
          description: Société locataire, obligatoire pour un bail société.
        tenantId:
          type:
            - integer
            - "null"
          format: int64
          description: Personne physique locataire, obligatoire hors bail société.
        propertyAddress:
          type: string
          description: >-
            Libellé de l'adresse du bien. Le backend réutilise l'adresse existante
