openapi: 3.1.0
info:
  title: HomeOfficeExpenses API
  description: Local API for generating rent receipts and home-office expense statements.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Generated server url
paths:
  /api/settings:
    get:
      tags:
        - settings-controller
      operationId: getSettings
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/SettingsDto"
    put:
      tags:
        - settings-controller
      operationId: updateSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/SettingsDto"
  /api/expense-items/{id}:
    put:
      tags:
        - expense-item-controller
      operationId: updateExpenseItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseItemRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ExpenseItemDto"
    delete:
      tags:
        - expense-item-controller
      operationId: deleteExpenseItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
  /api/admin/llm:
    get:
      tags:
        - admin-llm-controller
      operationId: getLlmConfig
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/LlmConfigDto"
    put:
      tags:
        - admin-llm-controller
      operationId: updateLlmConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LlmConfigRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/LlmConfigDto"
  /api/templates:
    get:
      tags:
        - template-controller
      operationId: listTemplates
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - RENT_RECEIPT
              - EXPENSE_STATEMENT
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateDto"
    post:
      tags:
        - template-controller
      operationId: uploadTemplate
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - RENT_RECEIPT
              - EXPENSE_STATEMENT
        - name: name
          in: query
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/TemplateDto"
  /api/templates/{id}/preview:
    post:
      tags:
        - template-controller
      operationId: previewTemplate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
  /api/templates/{id}/activate:
    post:
      tags:
        - template-controller
      operationId: activateTemplate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/TemplateDto"
  /api/templates/default/{type}:
    get:
      tags:
        - template-controller
      operationId: getDefaultTemplate
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - RENT_RECEIPT
              - EXPENSE_STATEMENT
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
    post:
      tags:
        - template-controller
      operationId: resetDefaultTemplate
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - RENT_RECEIPT
              - EXPENSE_STATEMENT
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/TemplateDto"
  /api/rent-receipts:
    get:
      tags:
        - rent-receipt-controller
      operationId: listRentReceipts
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RentReceiptDto"
    post:
      tags:
        - rent-receipt-controller
      operationId: createRentReceipt
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentReceiptRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/RentReceiptDto"
  /api/rent-receipts/preview:
    post:
      tags:
        - rent-receipt-controller
      operationId: previewRentReceipt
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentReceiptRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
  /api/receipts:
    post:
      tags:
        - receipt-controller
      operationId: uploadReceipt
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ReceiptDto"
  /api/receipts/{id}/analysis:
    post:
      tags:
        - receipt-controller
      operationId: startReceiptAnalysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "202":
          description: Accepted
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/AnalysisStartResponse"
  /api/expense-statements:
    get:
      tags:
        - expense-statement-controller
      operationId: listExpenseStatements
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatementDto"
    post:
      tags:
        - expense-statement-controller
      operationId: createExpenseStatement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementGenerationRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/StatementDto"
  /api/expense-statements/preview:
    post:
      tags:
        - expense-statement-controller
      operationId: previewStatement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementPreviewRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
  /api/expense-statements/draft:
    post:
      tags:
        - expense-statement-controller
      operationId: createStatementDraft
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/DraftDto"
  /api/expense-statements/calculation:
    post:
      tags:
        - expense-statement-controller
      operationId: calculateStatement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementCalculationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/CalculationResponse"
  /api/expense-items:
    get:
      tags:
        - expense-item-controller
      operationId: listExpenseItems
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseItemDto"
    post:
      tags:
        - expense-item-controller
      operationId: createExpenseItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseItemRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ExpenseItemDto"
  /api/e2e/reset:
    post:
      tags:
        - e-2e-controller
      operationId: resetE2eData
      responses:
        "204":
          description: No Content
  /api/admin/llm/test:
    post:
      tags:
        - admin-llm-controller
      operationId: testLlm
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/LlmTestResponse"
  /api/templates/{id}/file:
    get:
      tags:
        - template-controller
      operationId: getTemplateFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
  /api/templates/variables:
    get:
      tags:
        - template-controller
      operationId: getTemplateVariables
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - RENT_RECEIPT
              - EXPENSE_STATEMENT
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateVariableDto"
  /api/rent-receipts/{id}:
    get:
      tags:
        - rent-receipt-controller
      operationId: getRentReceipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/RentReceiptDto"
  /api/rent-receipts/{id}/pdf:
    get:
      tags:
        - rent-receipt-controller
      operationId: getRentReceiptPdf
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
  /api/rent-receipts/active:
    get:
      tags:
        - rent-receipt-controller
      operationId: getActiveRentReceipt
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
        - name: landlordId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: tenantId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/RentReceiptDto"
  /api/receipts/{id}:
    get:
      tags:
        - receipt-controller
      operationId: getReceipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ReceiptDto"
    delete:
      tags:
        - receipt-controller
      operationId: deleteReceipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
  /api/receipts/{id}/file:
    get:
      tags:
        - receipt-controller
      operationId: getReceiptFile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
  /api/expense-statements/{id}:
    get:
      tags:
        - expense-statement-controller
      operationId: getExpenseStatement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/StatementDto"
  /api/expense-statements/{id}/pdf:
    get:
      tags:
        - expense-statement-controller
      operationId: getExpenseStatementPdf
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: complete
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: string
                format: byte
  /api/expense-statements/{id}/zip:
    get:
      tags:
        - expense-statement-controller
      operationId: getExpenseStatementZip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/zip:
              schema:
                type: string
                format: binary
  /api/expense-statements/active:
    get:
      tags:
        - expense-statement-controller
      operationId: getActiveExpenseStatement
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/StatementDto"
  /api/analyses/{id}:
    get:
      tags:
        - analysis-controller
      operationId: getAnalysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/AnalysisDto"
    delete:
      tags:
        - analysis-controller
      operationId: cancelAnalysis
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/AnalysisDto"
  /api/admin/llm/status:
    get:
      tags:
        - admin-llm-controller
      operationId: getLlmStatus
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/LlmStatusDto"
  /api/admin/llm/models:
    get:
      tags:
        - admin-llm-controller
      operationId: listLlmModels
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LlmModelDto"
  /api/admin/llm/default-prompt:
    get:
      tags:
        - admin-llm-controller
      operationId: getDefaultLlmPrompt
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/DefaultPromptDto"
  /api/templates/{id}:
    delete:
      tags:
        - template-controller
      operationId: deleteTemplate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
  /api/signatures:
    get:
      tags:
        - signature-controller
      operationId: listSignatures
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignatureDto"
    post:
      tags:
        - signature-controller
      operationId: createSignature
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - LANDLORD
                    - ENTREPRISE_CEO
                name:
                  type: string
                landlordId:
                  type: integer
                  format: int64
                file:
                  type: string
                  format: binary
              required:
                - type
                - name
                - file
        required: true
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/SignatureDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
  /api/signatures/{id}:
    delete:
      tags:
        - signature-controller
      operationId: deleteSignature
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
  /api/signatures/{id}/image:
    get:
      tags:
        - signature-controller
      operationId: getSignatureImage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
  /api/landlords:
    get:
      tags:
        - rent-configuration-controller
      operationId: listLandlords
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LandlordDto"
    post:
      tags:
        - rent-configuration-controller
      operationId: createLandlord
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LandlordRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/LandlordDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/landlords/{id}:
    put:
      tags:
        - rent-configuration-controller
      operationId: updateLandlord
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LandlordRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/LandlordDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
        - rent-configuration-controller
      operationId: deleteLandlord
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/tenants:
    get:
      tags:
        - rent-configuration-controller
      operationId: listTenants
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantDto"
    post:
      tags:
        - rent-configuration-controller
      operationId: createTenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/TenantDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/tenants/{id}:
    put:
      tags:
        - rent-configuration-controller
      operationId: updateTenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/TenantDto"
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    delete:
      tags:
        - rent-configuration-controller
      operationId: deleteTenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/leases:
    get:
      tags:
        - rent-configuration-controller
      operationId: listLeases
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaseDto"
    post:
      tags:
        - rent-configuration-controller
