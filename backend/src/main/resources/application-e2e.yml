spring:
  datasource:
    url: jdbc:h2:mem:homeofficeexpenses-e2e;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update

app:
  data-dir: ${APP_DATA_DIR:./target/e2e-data}

logging:
  level:
    fr.hkof.homeofficeexpenses: INFO
