spring:
  application:
    name: homeofficeexpenses
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/homeofficeexpenses}
    username: ${SPRING_DATASOURCE_USERNAME:homeofficeexpenses}
    password: ${SPRING_DATASOURCE_PASSWORD:homeofficeexpenses}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  data-dir: ${APP_DATA_DIR:./data}
  cors-allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:8080}
  llm:
    default-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    default-model: ${OLLAMA_MODEL:qwen2.5:7b}

logging:
  level:
    fr.hkof.homeofficeexpenses: INFO
