spring:
  application:
    name: homeofficeexpenses
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/homeofficeexpenses}
    username: ${SPRING_DATASOURCE_USERNAME:homeofficeexpenses}
    password: ${SPRING_DATASOURCE_PASSWORD:homeofficeexpenses}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mvc:
    problemdetails:
      enabled: true
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax
        secure: false

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  data-dir: ${APP_DATA_DIR:./data}
  cors-allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:8080}
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
  auth:
    confirmation-url: ${APP_AUTH_CONFIRMATION_URL:http://localhost:5173/confirmer-email}
    confirmation-ttl: 24h
  llm:
    default-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    default-model: ${OLLAMA_MODEL:qwen2.5:7b}

analysis:
  pdftext:
    command: ${ANALYSIS_PDFTEXT_COMMAND:pdftotext}
    timeout: ${ANALYSIS_PDFTEXT_TIMEOUT:15s}
  ocr:
    enabled: ${ANALYSIS_OCR_ENABLED:true}
    command: ${ANALYSIS_OCR_COMMAND:tesseract}
    language: ${ANALYSIS_OCR_LANGUAGE:fra}
    timeout-per-page: ${ANALYSIS_OCR_TIMEOUT_PER_PAGE:30s}

logging:
  level:
    fr.hkof.homeofficeexpenses: INFO
