spring:
  datasource:
    url: jdbc:h2:mem:fraisocc-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  data-dir: ./target/test-data
  llm:
    default-url: http://localhost:8089
    default-model: mock-model
